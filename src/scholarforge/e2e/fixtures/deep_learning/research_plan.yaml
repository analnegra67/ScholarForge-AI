field_name: Mathematical foundations of deep learning
scope: >-
  The calculus, linear algebra, optimisation and automatic differentiation needed to define, train and
  analyse feedforward neural networks, presented with proofs at the level of a first graduate course.
  Out of scope: architectures beyond feedforward networks, statistical learning theory beyond the
  universal approximation theorem, and implementation details of specific software frameworks.
subfields: [differential calculus, linear algebra, convex optimisation, automatic differentiation, neural networks]
concept_map:
  - {concept: derivative, description: "local linear approximation of a function", depends_on: []}
  - {concept: chain rule, description: "derivative of a composition", depends_on: [derivative]}
  - {concept: vectors and matrices, description: "column vectors, matrix products, transpose", depends_on: []}
  - {concept: gradient and Jacobian, description: "first derivatives of multivariate maps", depends_on: [derivative, vectors and matrices]}
  - {concept: convexity and smoothness, description: "conditions under which descent methods provably work", depends_on: [gradient and Jacobian]}
  - {concept: gradient descent, description: "iterative minimisation along the negative gradient", depends_on: [convexity and smoothness]}
  - {concept: computational graph, description: "a program as a graph of elementary operations", depends_on: [chain rule]}
  - {concept: reverse-mode automatic differentiation, description: "adjoint propagation through the graph", depends_on: [computational graph, gradient and Jacobian]}
  - {concept: feedforward network, description: "composition of affine maps and activations", depends_on: [vectors and matrices]}
  - {concept: backpropagation, description: "reverse-mode AD applied to a network loss", depends_on: [reverse-mode automatic differentiation, feedforward network]}
  - {concept: universal approximation, description: "density of one-hidden-layer networks in C([0,1]^n)", depends_on: [feedforward network]}
prerequisites: [single-variable calculus, basic linear algebra (matrices, determinants), elementary probability]
key_theories:
  - {name: Chain rule and multivariate differentiation, status: established, notes: classical analysis}
  - {name: Convergence of gradient descent for convex L-smooth functions, status: established, notes: "O(1/k) rate"}
  - {name: Backpropagation as reverse-mode automatic differentiation, status: established, notes: ""}
  - {name: Universal approximation by one-hidden-layer networks, status: established, notes: "Cybenko 1989; Hornik 1991"}
  - {name: Why overparameterised networks trained by SGD generalise, status: contested, notes: "active research; several competing explanations"}
open_problems:
  - Theoretical explanation of generalisation in heavily overparameterised networks.
  - Global convergence guarantees for training deep non-convex networks in realistic regimes.
conventions:
  - {topic: vectors, choice: "bold lowercase column vectors; bold uppercase matrices", rationale: "standard in ML texts"}
  - {topic: gradient, choice: "the gradient is a column vector; Jacobians have one row per output", rationale: "consistent chain rule J_{F∘G} = J_F J_G"}
  - {topic: logarithm, choice: "log denotes the natural logarithm", rationale: ""}
